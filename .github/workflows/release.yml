name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create and publish (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Generate app icon
        run: npm run icon

      - name: Build AppImage and RPM
        run: npx electron-builder --linux AppImage rpm --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LinuxMail-linux
          path: |
            dist/*.AppImage
            dist/*.rpm

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          # On manual runs the given tag is created on the built commit;
          # on tag pushes the pushed tag is used as-is.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          files: |
            dist/*.AppImage
            dist/*.rpm
          generate_release_notes: true
